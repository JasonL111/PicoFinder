name: Android CI and APK delivery
on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.build.outputs.publish }}
      tag: ${{ steps.build.outputs.tag }}
      prerelease: ${{ steps.build.outputs.prerelease }}
      version_name: ${{ steps.build.outputs.version_name }}
      version_code: ${{ steps.build.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: build
        name: Resolve APK version and publication channel
        run: python tools/ci_release.py metadata

  firmware-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Firmware and delivery integrity tests
        run: |
          python -m unittest discover -s tests/protocol -v
          python -m unittest discover -s tests/ci -v
      - name: Python syntax and whitespace
        run: |
          python -m compileall -q firmware/pico2w tools tests
          git diff --check

  android:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install checksummed Android CLI and SDK 36
        run: bash .github/scripts/setup-android.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: JVM unit tests, lint, Debug APK and UI test APK
        working-directory: android
        env:
          APK_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          APK_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
        run: bash ../.github/scripts/build-android.sh
      - name: Verify signature and package downloadable APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          python tools/ci_release.py package --apk android/app/build/outputs/apk/debug/app-debug.apk --directory "$RUNNER_TEMP/apk-dist"
          python tools/ci_release.py validate --directory "$RUNNER_TEMP/apk-dist"
      - uses: actions/upload-artifact@v6
        with:
          name: local-ble-finder-debug
          path: ${{ runner.temp }}/apk-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-validation-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/
            ${{ runner.temp }}/android-build.log

  publish:
    needs: [metadata, firmware-protocol, android]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: local-ble-finder-debug
          path: ${{ runner.temp }}/apk-dist/
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          APK_DIRECTORY: ${{ runner.temp }}/apk-dist
        run: bash .github/scripts/publish-apk.sh
